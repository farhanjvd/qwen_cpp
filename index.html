<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polygon Region Selector</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 350px;
            background: white;
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            overflow-y: auto;
            z-index: 1000;
        }

        .map-container {
            flex: 1;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }

        h2 {
            color: #555;
            margin: 20px 0 10px;
            font-size: 18px;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin: 5px 0;
            width: 100%;
        }

        .btn-primary {
            background: #4CAF50;
            color: white;
        }

        .btn-primary:hover {
            background: #45a049;
        }

        .btn-danger {
            background: #f44336;
            color: white;
        }

        .btn-danger:hover {
            background: #da190b;
        }

        .btn-secondary {
            background: #2196F3;
            color: white;
        }

        .btn-secondary:hover {
            background: #1976D2;
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .instructions {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border-left: 4px solid #2196F3;
        }

        .instructions p {
            color: #1976D2;
            font-size: 14px;
            line-height: 1.6;
        }

        .polygon-list {
            list-style: none;
            margin-top: 10px;
        }

        .polygon-item {
            background: #f9f9f9;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ddd;
        }

        .polygon-item h3 {
            color: #333;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .polygon-info {
            font-size: 13px;
            color: #666;
            margin: 5px 0;
        }

        .polygon-actions {
            margin-top: 10px;
        }

        .polygon-actions button {
            padding: 8px 12px;
            font-size: 12px;
            width: auto;
            margin-right: 5px;
        }

        .status {
            padding: 10px;
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 5px;
            margin: 10px 0;
            color: #856404;
        }

        .status.active {
            background: #d4edda;
            border-color: #28a745;
            color: #155724;
        }

        .coordinates {
            font-family: monospace;
            font-size: 12px;
            background: #f4f4f4;
            padding: 10px;
            border-radius: 3px;
            max-height: 150px;
            overflow-y: auto;
            word-break: break-all;
        }

        .export-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>🗺️ Polygon Selector</h1>
            
            <div class="instructions">
                <p><strong>How to use:</strong></p>
                <p>1. Click "Start Drawing" to begin</p>
                <p>2. Click on the map to add vertices</p>
                <p>3. Click the first point or "Finish Polygon" to complete</p>
                <p>4. Save your polygon with a custom name</p>
            </div>

            <button id="startBtn" class="btn btn-primary" onclick="startDrawing()">✏️ Start Drawing</button>
            <button id="finishBtn" class="btn btn-secondary" onclick="finishPolygon()" disabled>✓ Finish Polygon</button>
            <button id="cancelBtn" class="btn btn-danger" onclick="cancelDrawing()" disabled>✕ Cancel</button>
            <button id="clearAllBtn" class="btn btn-danger" onclick="clearAllPolygons()">🗑️ Clear All Polygons</button>

            <div id="status" class="status" style="display: none;"></div>

            <h2>Saved Polygons</h2>
            <ul id="polygonList" class="polygon-list">
                <li style="color: #999; text-align: center; padding: 20px;">No polygons saved yet</li>
            </ul>

            <div class="export-section">
                <h2>Export Data</h2>
                <button class="btn btn-secondary" onclick="exportToGeoJSON()">📥 Export as GeoJSON</button>
            </div>
        </div>

        <div class="map-container">
            <div id="map"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize map
        const map = L.map('map').setView([40.7128, -74.0060], 12);

        // Add OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // State variables
        let isDrawing = false;
        let currentPolygon = null;
        let currentPoints = [];
        let polygons = [];
        let tempMarker = null;

        // DOM elements
        const startBtn = document.getElementById('startBtn');
        const finishBtn = document.getElementById('finishBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const statusDiv = document.getElementById('status');
        const polygonList = document.getElementById('polygonList');

        // Map click handler
        map.on('click', function(e) {
            if (!isDrawing) return;

            const latlng = e.latlng;
            currentPoints.push(latlng);

            // Add marker for the point
            L.circleMarker(latlng, {
                radius: 6,
                fillColor: '#ff6b6b',
                color: '#fff',
                weight: 2,
                opacity: 1,
                fillOpacity: 0.8
            }).addTo(map);

            // Update or create polygon preview
            if (currentPoints.length > 1) {
                if (currentPolygon) {
                    map.removeLayer(currentPolygon);
                }
                currentPolygon = L.polygon(currentPoints, {
                    color: '#ff6b6b',
                    weight: 2,
                    opacity: 0.8,
                    fillOpacity: 0.3
                }).addTo(map);
            }

            updateStatus(`Drawing: ${currentPoints.length} points clicked. Click first point or "Finish Polygon" to complete.`);
        });

        function startDrawing() {
            if (isDrawing) return;
            
            isDrawing = true;
            currentPoints = [];
            currentPolygon = null;
            
            startBtn.disabled = true;
            finishBtn.disabled = false;
            cancelBtn.disabled = false;
            
            map.getContainer().style.cursor = 'crosshair';
            updateStatus('Click on the map to start adding points to your polygon.', true);
        }

        function finishPolygon() {
            if (!isDrawing || currentPoints.length < 3) {
                alert('Please add at least 3 points to create a polygon.');
                return;
            }

            // Remove temporary polygon
            if (currentPolygon) {
                map.removeLayer(currentPolygon);
            }

            // Create final polygon
            const finalPolygon = L.polygon(currentPoints, {
                color: '#4CAF50',
                weight: 2,
                opacity: 0.8,
                fillOpacity: 0.3
            }).addTo(map);

            // Calculate area (simplified)
            const area = calculateArea(currentPoints);

            // Store polygon data
            const polygonData = {
                id: Date.now(),
                name: `Polygon ${polygons.length + 1}`,
                points: currentPoints.map(p => ({ lat: p.lat, lng: p.lng })),
                area: area,
                layer: finalPolygon
            };

            polygons.push(polygonData);
            
            // Add popup to polygon
            finalPolygon.bindPopup(`<strong>${polygonData.name}</strong><br>Area: ${area.toFixed(2)} km²`);

            // Reset drawing state
            resetDrawing();
            
            // Update polygon list
            updatePolygonList();
            
            updateStatus(`Polygon saved! Area: ${area.toFixed(2)} km²`, true);
        }

        function cancelDrawing() {
            if (!isDrawing) return;

            // Remove temporary markers and polygon
            map.eachLayer(function(layer) {
                if (layer instanceof L.CircleMarker && currentPoints.some(p => 
                    Math.abs(p.lat - layer.getLatLng().lat) < 0.0001 && 
                    Math.abs(p.lng - layer.getLatLng().lng) < 0.0001)) {
                    map.removeLayer(layer);
                }
            });

            if (currentPolygon) {
                map.removeLayer(currentPolygon);
            }

            resetDrawing();
            updateStatus('Drawing cancelled.', false);
        }

        function resetDrawing() {
            isDrawing = false;
            currentPoints = [];
            currentPolygon = null;
            
            startBtn.disabled = false;
            finishBtn.disabled = true;
            cancelBtn.disabled = true;
            
            map.getContainer().style.cursor = '';
        }

        function clearAllPolygons() {
            if (polygons.length === 0) {
                alert('No polygons to clear.');
                return;
            }

            if (!confirm('Are you sure you want to delete all polygons?')) return;

            // Remove all polygon layers
            polygons.forEach(p => map.removeLayer(p.layer));
            polygons = [];
            
            updatePolygonList();
            updateStatus('All polygons cleared.', false);
        }

        function updatePolygonList() {
            if (polygons.length === 0) {
                polygonList.innerHTML = '<li style="color: #999; text-align: center; padding: 20px;">No polygons saved yet</li>';
                return;
            }

            polygonList.innerHTML = '';
            polygons.forEach((polygon, index) => {
                const li = document.createElement('li');
                li.className = 'polygon-item';
                li.innerHTML = `
                    <h3>📍 ${polygon.name}</h3>
                    <div class="polygon-info">Points: ${polygon.points.length}</div>
                    <div class="polygon-info">Area: ${polygon.area.toFixed(2)} km²</div>
                    <div class="coordinates">${polygon.points.map(p => `[${p.lat.toFixed(4)}, ${p.lng.toFixed(4)}]`).join(', ')}</div>
                    <div class="polygon-actions">
                        <button class="btn btn-secondary" onclick="zoomToPolygon(${index})">🔍 Zoom</button>
                        <button class="btn btn-danger" onclick="deletePolygon(${index})">🗑️ Delete</button>
                    </div>
                `;
                polygonList.appendChild(li);
            });
        }

        function zoomToPolygon(index) {
            const polygon = polygons[index];
            if (polygon) {
                const bounds = polygon.layer.getBounds();
                map.fitBounds(bounds);
                polygon.layer.openPopup();
            }
        }

        function deletePolygon(index) {
            if (!confirm('Delete this polygon?')) return;

            const polygon = polygons[index];
            map.removeLayer(polygon.layer);
            polygons.splice(index, 1);
            
            updatePolygonList();
        }

        function updateStatus(message, isActive = false) {
            statusDiv.textContent = message;
            statusDiv.style.display = 'block';
            statusDiv.className = isActive ? 'status active' : 'status';
        }

        function calculateArea(points) {
            // Simplified area calculation using the Haversine formula
            // Returns area in square kilometers
            let area = 0;
            const R = 6371; // Earth's radius in km
            
            if (points.length < 3) return 0;
            
            for (let i = 0; i < points.length; i++) {
                const j = (i + 1) % points.length;
                const lat1 = points[i].lat * Math.PI / 180;
                const lat2 = points[j].lat * Math.PI / 180;
                const lng1 = points[i].lng * Math.PI / 180;
                const lng2 = points[j].lng * Math.PI / 180;
                
                area += (lng2 - lng1) * (2 * Math.sin(lat1) + Math.sin(lat1));
            }
            
            area = Math.abs(area * R * R / 2);
            return area;
        }

        function exportToGeoJSON() {
            if (polygons.length === 0) {
                alert('No polygons to export.');
                return;
            }

            const geojson = {
                type: "FeatureCollection",
                features: polygons.map(polygon => ({
                    type: "Feature",
                    properties: {
                        name: polygon.name,
                        area_km2: polygon.area.toFixed(2)
                    },
                    geometry: {
                        type: "Polygon",
                        coordinates: [polygon.points.map(p => [p.lng, p.lat])]
                    }
                }))
            };

            const dataStr = JSON.stringify(geojson, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = 'polygons.geojson';
            a.click();
            
            URL.revokeObjectURL(url);
        }

        // Initialize status
        updateStatus('Ready to draw. Click "Start Drawing" to begin.', false);
    </script>
</body>
</html>
